<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARANOIA — doomsday</title>
<style>
  /* Display: Archivo (variable width) · UI: Inter. The finale and the white cards add the faces
     the user asked for (typewriter, slab, handwritten; the reference's hand lettering + brush). */
  @font-face { font-family: Display; src: url(fonts/display.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: UI; src: url(fonts/ui.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Typewriter; src: url(fonts/courier-prime-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Slab; src: url(fonts/roboto-slab-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Hand; src: url(fonts/caveat-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Letter; src: url(fonts/sedgwick-ave-display-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Brush; src: url(fonts/permanent-marker-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm": "/node_modules/opentype.js/dist/opentype.module.js"
} }
</script>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
