*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0A0807}

.small{letter-spacing:0.06em}
.hook-title{position:absolute;left:0;right:0;top:324px}

.frzbox,.whybox{background:#0A0807;padding:32px 0 43px;box-shadow:0 0 0 4px #FFD21F}
.frz{}
.why{}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,7,.15),rgba(10,8,7,.55) 45%,rgba(10,8,7,.15))}

.sheet img{width:100%;height:100%;object-fit:contain}
.tape{position:absolute;width:280px;height:64px;background:rgba(241,230,207,.75);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.marker{position:absolute;inset:0;width:100%;height:100%}
.marker ellipse{fill:none;stroke:#B3120F;stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.band{position:absolute;overflow:hidden;border:6px solid #0A0807}
.band img{width:100%;height:100%;display:block;background:#0A0807}
.bandlabel{position:absolute;left:0;right:0;top:885px;opacity:0}
.bandlabel .t{text-shadow:0 0 32px #0A0807,0 8px 0 #0A0807}
#glasscv{position:absolute;left:0;top:0;width:1920px;height:1080px}

(function(){
  const cv = document.getElementById('glasscv');
  const R = new THREE.WebGLRenderer({canvas: cv, antialias: true, preserveDrawingBuffer: true});
  R.setPixelRatio(1); R.setSize(1920, 1080, false);
  const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const U = { uBg:{value:null}, uLogo:{value:null}, uForm:{value:0}, uTime:{value:0},
              uRes:{value:new THREE.Vector2(1920,1080)}, uLogoBox:{value:new THREE.Vector4(0,0,1,1)} };
  const mat = new THREE.ShaderMaterial({ uniforms: U, vertexShader:
    'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }',
    fragmentShader: `
    precision highp float; varying vec2 vUv;
    uniform sampler2D uBg, uLogo; uniform float uForm, uTime; uniform vec2 uRes; uniform vec4 uLogoBox;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float logoA(vec2 uv){ vec2 l=(uv-uLogoBox.xy)/uLogoBox.zw; if(l.x<0.0||l.y<0.0||l.x>1.0||l.y>1.0) return 0.0;
