<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARANOIA — Bad Vibes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- SVG filters: motion blur for whip-pan cut frames -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Horizontal motion blur for whip-pan cut frames -->
      <filter id="whip" x="-10%" y="0" width="120%" height="100%">
        <feGaussianBlur stdDeviation="70 2"/>
      </filter>
      <filter id="whip-v" x="0" y="-10%" width="100%" height="120%">
        <feGaussianBlur stdDeviation="2 80"/>
      </filter>
    </defs>
  </svg>

  <div id="viewport">
    <div id="stage">

      <!-- Everything that may shake lives here. The logo does NOT. -->
      <div id="shake" class="layer">
        <div id="scenes" class="layer"><!-- shirt scenes are built by js/main.js --></div>

        <!-- Opening flash montage (frames built by js/main.js) -->
        <section class="scene intro" id="intro"></section>

        <!-- BAD VIBEEEES interludes: clean white, typewriter, cut by the top edge -->
        <section class="scene bv" id="bv1">
          <h1 class="bv-type"><span>BAD</span><span>VIBEEEES</span></h1>
        </section>
        <section class="scene bv" id="bv2">
          <h1 class="bv-type"><span>BAD</span><span>VIBEEEES</span></h1>
        </section>

        <!-- Finale: same words, 5 type identities, dry cuts (no logo) -->
        <section class="scene finale" id="finale">
          <div class="fw fw-typewriter"><span>bad vibes</span></div>
          <div class="fw fw-normal"><span>bad vibes</span></div>
          <div class="fw fw-slab"><span>bad vibes</span></div>
          <div class="fw fw-hand"><span>bad vibes</span></div>
          <div class="fw fw-extended"><span>bad vibes</span></div>
        </section>
      </div>

      <!-- FIXED LOGO LAYER: centered, never animated, only cut on/off -->
      <img id="logo" src="assets/logo/paranoia-logo-branca-2.png" alt="PARANOIA">

      <!-- Film / xerox finishing -->
      <div id="grain" class="layer"></div>
      <div id="flash" class="layer"></div>
    </div>
  </div>

  <div id="hud">
    <button id="btnPlay" type="button">▶ PLAY</button>
    <span id="clock">00.00 / 30.00</span>
    <span class="hint">espaço: play/pause · R: reiniciar · ←/→: ±1s</span>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
